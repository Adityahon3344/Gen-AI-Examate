services:
  - type: web
    name: krishiyojana-ui
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements-ui.txt
    startCommand: streamlit run ui/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_URL
        value: https://gen-ai-examate.onrender.com
