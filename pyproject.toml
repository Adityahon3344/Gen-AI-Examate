
[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
    "data/chroma_db",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring initialized project services or external integrations",
]
